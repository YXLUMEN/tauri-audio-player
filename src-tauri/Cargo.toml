[package]
name = "app"
version = "0.1.7"
description = "A Tauri Audio Player"
authors = ["YXLumen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
incremental = true # 以较小的步骤编译二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好地优化
lto = true # 启用链接时优化
opt-level = 3 # 优先考虑小的二进制文件大小
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

sha2 = "0.10.9"

symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "flac", "wav", "vorbis"] }
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
