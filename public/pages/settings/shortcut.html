<section class="setting-context">
    <div class="subtitle">快捷键</div>
    <div data-compound="setting-shortcut, load-custom-shortcut"
         class="setting-details table"
         id="shortcuts-settings">

        <div class="title-like">播放/暂停</div>
        <div class="key" data-action="queue.pause">Space</div>

        <div class="title-like">上一首</div>
        <div class="key" data-action="queue.backward">左方向键</div>

        <div class="title-like">下一首</div>
        <div class="key" data-action="queue.forward">右方向键</div>

        <div class="title-like">提高音量</div>
        <div class="key" data-action="player.volume.increase">上方向键</div>

        <div class="title-like">降低音量</div>
        <div class="key" data-action="player.volume.decrease">下方向键</div>

        <div class="title-like">切换静音</div>
        <div class="key" data-action="player.volume.mute">M</div>

        <div class="title-like">播放模式切换</div>
        <div class="key" data-action="player.mode">R</div>

        <div class="title-like">滚动到当前播放</div>
        <div class="key" data-action="queue.highlight">H</div>

        <div class="title-like">显示/隐藏 歌词</div>
        <div class="key" data-action="player.lyric.show">C</div>

        <div class="title-like">显示/隐藏 播放列表</div>
        <div class="key" data-action="queue.show">L</div>

        <div class="title-like">显示/隐藏 设置界面</div>
        <div class="key" data-action="setting.show">S</div>

        <div class="title-like">显示/隐藏 播放器</div>
        <div class="key" data-action="player.show">P</div>

        <div class="title-like">更新远程音乐列表</div>
        <div class="key" data-action="queue.remote.art.update">+</div>
    </div>
</section>
