<section data-compound="other-settings"
         class="setting-context">

    <div class="subtitle" id="other">其他</div>

    <div class="setting-details table">
        <span class="title-like">检查更新</span>
        <input class="base-button"
               data-action="check-update"
               type="button"
               value="立即检查">

        <span class="title-like">启动时检查更新</span>
        <div class="base-switch">
            <label>
                <input type="checkbox" data-action="auto-check" checked>
                <span class="slider"></span>
            </label>
        </div>

        <span class="title-like">退出到托盘</span>
        <div class="base-switch">
            <label>
                <input type="checkbox" data-action="quit-to-tray" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
</section>
