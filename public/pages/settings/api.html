<section class="setting-context">

    <div data-compound="token-settings"
         class="setting-details long">

        <span class="title-like">ART</span>
        <label class="custom-input-label vertical" data-plugin="art">
            <input class="base-input" placeholder="Api Key" name="api-key" type="text" autocomplete="off">

        </label>

    </div>
</section>
