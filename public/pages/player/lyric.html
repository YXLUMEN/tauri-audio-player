<section data-compound="lyric-title"
         class="lyric-container hide"
         id="lyric-container">
    <h3 class="lyric-title" id="lyric-title"></h3>

    <div data-compound="lyric-scroll"
         class="lyric-box"
         id="lyric-box">

        <div data-compound="lyric-offset"
             class="lyric-calibration"
             id="set-lyric-offset">
            <img src="/img/audio/ico/up.svg" alt="-0.1" width="20">
            <img src="/img/audio/ico/deletion.svg" alt="0" width="20">
            <img src="/img/audio/ico/down.svg" alt="+0.1" width="20">
            <span id="lyric-offset"></span>
        </div>

        <div data-compound="lyric-content-render"
             class="lyric-content"
             id="lyric-ul">
            <div class="lyric-item">加载歌词中 . . .</div>
        </div>
    </div>
</section>
