<section data-compound="detail-folder-input"
         class="folder-editor"
         id="folder-editor">
    <div class="title">编辑歌单信息</div>
    <div class="input-box">
        <div class="texts">
            <label>
                <span>名称</span>
                <input class="base-input" id="folder-editor-name" autocomplete="off">
            </label>
            <label>
                <span>简介</span>
                <textarea class="base-input" id="folder-editor-desc"></textarea>
            </label>
            <div class="buttons" id="folder-editor-buttons">
                <button class="base-button" action="submit">确认</button>
                <button class="base-button cancel" action="cancel">取消</button>
            </div>
        </div>
        <img src="/img/audio/cover/audio-1.webp" alt="" id="folder-editor-cover">
    </div>
</section>
